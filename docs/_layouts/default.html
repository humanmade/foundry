<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
	<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
	<meta name="theme-color" content="#f97316">
	<meta property="og:title" content="{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}">
	<meta property="og:description" content="{{ site.description | strip_html | normalize_whitespace }}">
	<meta property="og:type" content="website">
	<meta property="og:url" content="{{ page.url | absolute_url }}">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f97316'/%3E%3Cpath fill='%23fff' d='M6.25 10h19.5v1.5c0 1.9-2.4 3.4-5.6 3.4h-1.1v3.4c0 1.2 1 2.2 2.2 2.2v1.9H10.75v-1.9c1.2 0 2.2-1 2.2-2.2v-3.4h-1.1c-3.2 0-5.6-1.5-5.6-3.4V10z'/%3E%3Cpath fill='%23fff' d='M10 23.9h12a.8.8 0 0 1 .8.8v.8a.8.8 0 0 1-.8.8H10a.8.8 0 0 1-.8-.8v-.8a.8.8 0 0 1 .8-.8z'/%3E%3C/svg%3E">
	<link rel="canonical" href="{{ page.url | absolute_url }}">
	<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="{% if page.url == '/' %}is-home{% else %}is-docs{% endif %}">

	<header class="site-header">
		<div class="wrap site-header-inner">
			<a class="brand" href="{{ '/' | relative_url }}">
				<svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
					<rect width="32" height="32" rx="7" fill="currentColor" opacity="0.12"/>
					<path fill="currentColor" d="M6.25 10h19.5v1.5c0 1.9-2.4 3.4-5.6 3.4h-1.1v3.4c0 1.2 1 2.2 2.2 2.2v1.9H10.75v-1.9c1.2 0 2.2-1 2.2-2.2v-3.4h-1.1c-3.2 0-5.6-1.5-5.6-3.4V10z"/>
					<path fill="currentColor" d="M10 23.9h12a.8.8 0 0 1 .8.8v.8a.8.8 0 0 1-.8.8H10a.8.8 0 0 1-.8-.8v-.8a.8.8 0 0 1 .8-.8z"/>
				</svg>
				<span>Foundry</span>
			</a>
			<nav class="site-nav" aria-label="Site">
				<a href="{{ '/' | relative_url }}#features">Features</a>
				<a href="{{ '/design/' | relative_url }}">Docs</a>
				<a class="nav-github" href="{{ site.github_url }}">
					<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
					<span>GitHub</span>
				</a>
			</nav>
		</div>
	</header>

	{{ content }}

	<footer class="site-footer">
		<div class="wrap site-footer-inner">
			<p>Foundry is licensed under the <a href="{{ site.github_url }}/blob/main/LICENSE.txt">GPLv2 or later</a>.</p>
			<p>A <a href="https://humanmade.com/">Human Made</a> experiment · <a href="{{ site.github_url }}">Source on GitHub</a></p>
		</div>
	</footer>

</body>
</html>
